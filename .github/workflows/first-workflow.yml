
name: Portfolio Website Check

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-website:
    name: Check portfolio files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check HTML file
        run: |
          if [ -f index.html ]; then
            echo "SUCCESS: index.html exists."
          else
            echo "ERROR: index.html is missing."
            exit 1
          fi

      - name: Check CSS file
        run: |
          if [ -f style.css ]; then
            echo "SUCCESS: style.css exists."
          else
            echo "ERROR: style.css is missing."
            exit 1
          fi
