
name: Portfolio Website Check

on:
  push:
    branches:
      - main

jobs:
  check-website:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Check HTML file
        run: test -f index.html && echo "SUCCESS: index.html exists."

      - name: Check CSS file
        run: test -f style.css && echo "SUCCESS: style.css exists."
