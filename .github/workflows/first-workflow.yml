
name: Portfolio Website Check

on:
  push:
    branches:
      - main

jobs:
  check-website:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Check HTML file
        run: |
          if [ -f index.html ]; then
            echo "SUCCESS: index.html exists."
          else
            echo "ERROR: index.html is missing."
            exit 1
          fi

      - name: Check CSS file
        run: |
          if [ -f style.css ]; then
            echo "SUCCESS: style.css exists."
          else
            echo "ERROR: style.css is missing."
            exit 1
          fi

